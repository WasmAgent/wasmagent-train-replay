name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      # TR-1: pinned setup-uv action + explicit uv version. The previous
      # `pip install uv` was unpinned and non-reproducible.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.7.6"
          enable-cache: true
      - name: Install dependencies (frozen lock)
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check train_replay tests
      - name: Typecheck
        run: uv run mypy train_replay
      - name: Test
        run: uv run pytest tests/ -v --cov=train_replay --cov-report=xml
      - uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          file: coverage.xml
